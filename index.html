<style>
  :root {
    --bg: #f4fff7;
    --surface: #ffffff;
    --surface2: #ecfdf3;
    --border: #ccebd8;
    --accent: #16a34a;
    --accent2: #22c55e;
    --green: #15803d;
    --red: #dc2626;
    --amber: #d97706;
    --text: #1f2937;
    --muted: #6b7280;
    --white: #ffffff;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px;
    right: -200px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(34,197,94,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    bottom: -200px;
    left: -150px;
    width: 450px;
    height: 450px;
    background: radial-gradient(circle, rgba(22,163,74,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    position: relative;
    z-index: 1;
  }

  .header {
    text-align: center;
    margin-bottom: 48px;
  }

  .header-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .header h1 {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 700;
    color: var(--text);
    line-height: 1.15;
    margin-bottom: 10px;
  }

  .header h1 span {
    color: var(--accent);
  }

  .header p {
    font-size: 14px;
    color: var(--muted);
    font-weight: 400;
  }

  .setup-card,
  .question-card,
  .results-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.04);
  }

  .setup-card h2 {
    font-size: 20px;
    margin-bottom: 10px;
  }

  .setup-card p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 28px;
  }

  .num-label {
    display: block;
    margin-bottom: 14px;
    color: var(--accent);
    font-size: 12px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .num-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }

  .num-btn,
  .topic-chip,
  .choice-btn,
  .next-btn {
    transition: all 0.2s ease;
  }

  .num-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    padding: 15px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
  }

  .num-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .num-btn.selected {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .custom-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }

  .custom-row input {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    width: 120px;
    font-size: 15px;
    outline: none;
  }

  .custom-row input:focus {
    border-color: var(--accent);
  }

  .custom-row label {
    color: var(--muted);
    font-size: 13px;
  }

  .topic-section {
    margin-bottom: 32px;
  }

  .topic-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .topic-chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
  }

  .topic-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .topic-chip.active {
    background: rgba(34,197,94,0.12);
    border-color: var(--accent);
    color: var(--accent);
  }

  .start-btn,
  .restart-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 16px;
    color: white;
    padding: 18px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.25s ease;
  }

  .start-btn:hover,
  .restart-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(34,197,94,0.25);
  }

  .quiz-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
  }

  .q-counter {
    font-size: 13px;
    color: var(--muted);
  }

  .q-counter span {
    color: var(--accent);
    font-weight: 700;
  }

  .score-badge {
    background: white;
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
  }

  .score-badge strong {
    color: var(--green);
  }

  .progress-bar {
    height: 8px;
    background: #dcfce7;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 30px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.3s ease;
  }

  .topic-tag {
    display: inline-block;
    background: rgba(34,197,94,0.1);
    border: 1px solid rgba(34,197,94,0.2);
    color: var(--accent);
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .question-text {
    font-size: 18px;
    line-height: 1.7;
    margin-bottom: 28px;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .choice-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
    color: var(--text);
  }

  .choice-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(34,197,94,0.08);
  }

  .choice-letter {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px 10px;
    font-size: 12px;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    color: var(--accent);
  }

  .choice-btn.correct {
    border-color: var(--green);
    background: rgba(34,197,94,0.12);
  }

  .choice-btn.wrong {
    border-color: var(--red);
    background: rgba(220,38,38,0.08);
  }

  .feedback {
    display: none;
    margin-top: 20px;
    padding: 24px;
    border-radius: 18px;
  }

  .feedback.show {
    display: block;
  }

  .correct-fb {
    background: rgba(34,197,94,0.08);
    border: 1px solid rgba(34,197,94,0.2);
  }

  .wrong-fb {
    background: rgba(220,38,38,0.06);
    border: 1px solid rgba(220,38,38,0.18);
  }

  .feedback-title {
    font-weight: 700;
    margin-bottom: 10px;
  }

  .correct-answer-line {
    margin-bottom: 10px;
    color: var(--green);
    font-size: 13px;
  }

  .explanation {
    color: var(--muted);
    line-height: 1.7;
    font-size: 14px;
  }

  .next-btn {
    width: 100%;
    margin-top: 20px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    cursor: pointer;
    color: var(--accent);
    font-weight: 700;
  }

  .next-btn:hover {
    border-color: var(--accent);
    background: rgba(34,197,94,0.05);
  }

  .results-card {
    text-align: center;
  }

  .results-emoji {
    font-size: 60px;
    margin-bottom: 18px;
    display: block;
  }

  .score-big {
    font-size: 64px;
    font-weight: 800;
    color: var(--accent);
    margin: 18px 0 10px;
  }

  .score-label {
    color: var(--muted);
    margin-bottom: 30px;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 30px;
  }

  .stat-box {
    background: var(--surface2);
    border-radius: 18px;
    padding: 18px;
  }

  .stat-num {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 12px;
    color: var(--muted);
  }

  .green { color: var(--green); }
  .red { color: var(--red); }
  .muted { color: var(--text); }

  @media (max-width: 700px) {
    .setup-card,
    .question-card,
    .results-card {
      padding: 24px;
    }

    .stats-row {
      grid-template-columns: 1fr;
    }

    .custom-row {
      flex-direction: column;
      align-items: flex-start;
    }
  }
</style>
